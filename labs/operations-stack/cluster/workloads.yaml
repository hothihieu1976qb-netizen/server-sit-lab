apiVersion: v1
kind: Namespace
metadata:
  name: sit-ops006
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledger
  namespace: sit-ops006
spec:
  replicas: 1
  selector:
    matchLabels: {app: ledger}
  template:
    metadata:
      labels: {app: ledger}
    spec:
      nodeSelector: {lab-placement: ledger}
      securityContext: {fsGroup: 10001}
      containers:
        - name: ledger
          image: sitlab/ops-platform:v1
          imagePullPolicy: Never
          env:
            - {name: SIT_ROLE, value: ledger}
          ports:
            - {containerPort: 8080, name: http}
          readinessProbe:
            httpGet: {path: /v1/ready, port: http}
            periodSeconds: 2
          livenessProbe:
            httpGet: {path: /live, port: http}
            periodSeconds: 5
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 500m, memory: 96Mi}
          volumeMounts:
            - {name: lab-data, mountPath: /data}
      volumes:
        - name: lab-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: ledger
  namespace: sit-ops006
spec:
  selector: {app: ledger}
  ports:
    - {name: http, port: 8080, targetPort: http}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: sit-ops006
spec:
  replicas: 1
  selector:
    matchLabels: {app: gateway}
  template:
    metadata:
      labels: {app: gateway}
    spec:
      nodeSelector: {lab-placement: gateway}
      containers:
        - name: gateway
          image: sitlab/ops-platform:v1
          imagePullPolicy: Never
          env:
            - {name: SIT_LEDGER, value: 'http://ledger:8080'}
          ports:
            - {containerPort: 8080, name: http}
          readinessProbe:
            httpGet: {path: /ready, port: http}
            periodSeconds: 2
            timeoutSeconds: 3
            failureThreshold: 2
          livenessProbe:
            httpGet: {path: /live, port: http}
            periodSeconds: 5
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 500m, memory: 96Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: sit-ops006
spec:
  selector: {app: gateway}
  ports:
    - {name: http, port: 8080, targetPort: http}
